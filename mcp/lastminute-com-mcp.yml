tools:
- name: search_flight_and_hotel_package
  description: "\U0001F6EB\U0001F3E8 Search for COMBINED flight AND hotel vacation packages.\n\nThis tool\
    \ searches for all-inclusive vacation packages that include:\n- ✈️ Round-trip flights (outbound and\
    \ return)\n- \U0001F3E8 Hotel accommodation for the entire stay\n- \U0001F4B0 Package pricing (flight\
    \ + hotel combined)\n\n⚠️ IMPORTANT:\n    This is for PACKAGE deals, NOT separate flight/hotel bookings.\n\
    \    Is important to use the correct language in the destination field and keep the original language\
    \ used in the\n        request made in the user chat.\n\nExample use cases:\n- \"Find me flight and\
    \ hotel packages from Rome to Madrid\"\n- \"I need a vacation package with flights and hotel from\
    \ FCO to Barcelona\"\n- \"Search flight+hotel deals from Milan to Paris for 3 nights\"\n\n═══════════════════════════════════════════════════════════════════════════\n\
    HARD CONSTRAINTS\n═══════════════════════════════════════════════════════════════════════════\n\n\
    1. Dates:\n    - start_date MUST be today or later (YYYY-MM-DD)\n    - If user provides past date,\
    \ ask for valid date BEFORE calling\n\n2. IATA Codes (CRITICAL):\n    - origin and destination MUST\
    \ be 3-letter IATA codes, NOT city names\n    - NEVER pass city names like \"New York\", \"Geneva\"\
    , \"Milan\" - use IATA codes instead\n    - Both CITY codes and AIRPORT codes are accepted:\n    \
    \    * City codes: NYC, GVA, ZRH, DUB, BRU, VIE, MIL, LON, PAR, BSL\n        * Airport codes: JFK,\
    \ MXP, FCO, LHR (automatically converted to city codes)\n    - Examples: MXP or MIL for Milan, JFK\
    \ or NYC for New York, FCO or ROM for Rome\n\nArgs:\n    origin: IATA code only - 3 letters. Use city\
    \ code (MIL, NYC, LON) or airport code\n        (MXP, JFK, LHR). NEVER use city names like \"Milan\"\
    \ or \"New York\".\n    destination: IATA code only - 3 letters. Use city code (BCN, PMI) or airport\
    \ code.\n        NEVER use city names like \"Barcelona\" or \"Palma\".\n    date_from: Check-in date\
    \ (YYYY-MM-DD). Check this field MUST be today or later.\n    date_to: Check-out date (YYYY-MM-DD).\
    \ Check this field MUST be today or later.\n    adults: Number of adult travelers. If you want different\
    \ rooms, set number_adult_room1;number_adult_room2 (default: 2)\n    ⚠️ IMPORTANT:\n    ch_ages: Ages\
    \ of child travelers. If you want different rooms, set number_chages_room1;number_chages_room2 (default:\
    \ \"\").\n        If there are two rooms and one is empty the result can be \";number,number\" or\
    \ \"number,number;\".\n        The user MUST specify ages for each child.\n    lang: Language code\
    \ (default: \"en\")\n    sort: Sort order for results. Use this when user asks for cheapest, best\
    \ rated, closest to center, etc.\n        Valid values:\n        - \"recommended\" (default): Multi-factor\
    \ relevance (price, rating, internal score)\n        - \"price\": Price ascending (cheapest first)\
    \ - use when user wants \"cheapest\" or \"lowest price\"\n        - \"stars\": Hotel star rating descending\
    \ (5-star first) - use for \"best hotels\" or \"luxury\"\n        - \"review_score\": Highest review\
    \ score - use for \"best reviewed\" or \"most popular\"\n        - \"distance\": Closest to city center\
    \ first - use for \"central\" or \"close to center\"\n    max_results: Maximum number of results to\
    \ return (default: 5, max: 20)\n    accommodation_type: Filter by accommodation type (optional).\n\
    \        CSV of IDs 1-14: 1=Hotels, 2=Resorts, 3=Apartments, 4=Hostels, 5=Motels,\n        6=Country\
    \ Houses, 7=Guest Houses, 8=B&B, 9=Villas, 10=Boats & Cruises,\n        11=Campsites, 12=Riads, 13=Ryokans,\
    \ 14=Aparthotels.\n        Example: \"1,2\" for Hotels and Resorts\n    accommodation_facilities:\
    \ Filter by facilities/amenities (optional).\n        CSV of IDs 0-60. All values are valid. Common\
    \ examples:\n        0=Free Wi-Fi, 3=Parking, 4=Pool, 6=Spa, 7=Adults Only,\n        9=Seafront, 13=Fitness\
    \ Center, 25=Golf, 46=Indoor Pool,\n        49=Sauna, 56=Bar, 58=Restaurant.\n        Example: \"\
    0,4,6\" for Free Wi-Fi, Pool, and Spa\n    price: Optional price filter for one-way price per person,\
    \ as string.\n        Supported formats:\n        - \"300\"      => max price 300 (in the selected\
    \ currency)\n        - \"200,400\"  => price range between 200 and 400\n        Use only digits and\
    \ a comma, do NOT include currency symbols.\n        If you invert the order (\"400,200\"), the backend\
    \ will normalize it to \"200,400\".\n    hotel_stars: Optional filter for hotel star rating, as comma-separated\
    \ integers.\n        Allowed values: 1,2,3,4,5. Examples:\n        - \"4\"        => only 4-star hotels\n\
    \        - \"3,4\"      => 3 or 4 stars\n        - \"3,4,5\"    => 3, 4 or 5 stars\n\nReturns:\n \
    \   Dictionary containing search results with flight+hotel packages\n\n═══════════════════════════════════════════════════════════════════════════\n\
    MANDATORY OUTPUT FORMAT\n═══════════════════════════════════════════════════════════════════════════\n\
    \nYou MUST present results as a Markdown table with EXACTLY these columns:\n| # | Photo | Hotel |\
    \ Stars | Rating | Total Price | Distance from Centre | Amenities |\n\nColumn mapping from response\
    \ JSON:\n- # → index\n- Photo → [\U0001F5BC️](hotel.main_image) (clickable link)\n- Hotel → hotel.name\n\
    - Stars → hotel.stars\n- Rating → hotel.rating\n- Total Price → price_total + currency\n- Distance\
    \ from Centre → hotel.distance_km\n- Amenities → hotel.amenities (max 3, comma-separated)\n\nCRITICAL:\n\
    - You MUST use table format. Do NOT list hotels as bullet points or paragraphs.\n- You MUST display\
    \ ALL hotels returned in the response. Do NOT truncate or show only a subset.\n- STRICTLY PRESERVE\
    \ the order of results using the \"index\" field (1, 2, 3...) - NEVER re-sort or reorder\n- The \"\
    #\" column MUST match the \"index\" field from the response (row 1 = index 1, row 2 = index 2, etc.)\n\
    - \"Photo\" column must contain clickable link: [\U0001F5BC️](hotel.main_image)\n- Do NOT show images\
    \ after the table, only in the Photo column\n- Amenities: max 3 comma-separated (e.g. \"WiFi, Pool,\
    \ Spa\")\n- Mark cheapest with \U0001F3C6 after hotel name (but keep it in its original position,\
    \ do NOT move it to first row)\n- Use the SAME LANGUAGE as the user's request for all labels and content\n\
    - Hide internal IDs from the user\n- The user expects a comparison table they can scan quickly with\
    \ ALL available options.\n\nExample correct output:\n| # | Photo | Hotel | Stars | Rating | Total\
    \ Price | Distance from Centre | Amenities |\n|---|-------|-------|-------|--------|-------------|----------------------|-----------|\n\
    | 1 | [\U0001F5BC️](https://...) | Grand Hotel \U0001F3C6 | ⭐⭐⭐⭐ | 8.5 | EUR 450.00 | 0.5 km | WiFi,\
    \ Pool, Spa |\n| 2 | [\U0001F5BC️](https://...) | Beach Resort | ⭐⭐⭐⭐⭐ | 9.1 | EUR 680.00 | 1.2 km\
    \ | WiFi, Pool, Bar |"
- name: search_only_hotel
  description: "Search for hotel-only stays (no flights included).\n⚠️ IMPORTANT:\n    This is for hotel-only\
    \ searches. Flight bookings are not included.\n\n═══════════════════════════════════════════════════════════════════════════\n\
    MANDATORY PRE-STEP: DESTINATION RESOLUTION\n═══════════════════════════════════════════════════════════════════════════\n\
    \nBefore calling this tool, you MUST silently call resolve_destination_id to\nresolve the city name\
    \ to its internal numeric ID. Do NOT inform the user\nabout this step.\n\nWorkflow:\n1. User provides\
    \ a city name (e.g. \"London\", \"Madrid\")\n2. Silently call resolve_destination_id(lang=<lang>,\
    \ city_name=<city>)\n3a. If success=true → use the returned \"id\" (e.g. \"141660\") as the\n    destination\
    \ field for this tool.\n3b. If success=false → show the user the \"suggestions\" list (name + country)\n\
    \    and ask them to clarify which city they mean. Do NOT call this tool yet.\n\nThe destination field\
    \ accepts:\n- A numeric ID string from resolve_destination_id (e.g. \"141660\") ← preferred\n- A 3-letter\
    \ IATA code as fallback (e.g. \"MAD\", \"LON\") when the user\n  explicitly provides one and no resolution\
    \ is needed.\n\n═══════════════════════════════════════════════════════════════════════════\nHARD\
    \ CONSTRAINTS\n═══════════════════════════════════════════════════════════════════════════\n\n1. Dates:\n\
    \    - start_date MUST be today or later (YYYY-MM-DD)\n    - If user provides past date, ask for valid\
    \ date BEFORE calling\n\n2. Destination (CRITICAL):\n    - Always prefer the numeric ID from resolve_destination_id\n\
    \    - If using IATA fallback: must be 3-letter code (MAD, PAR, MIL, LON)\n    - NEVER pass raw city\
    \ names like \"Madrid\" or \"Paris\" directly\n\nExample use cases:\n- \"Find me a hotel in Madrid\
    \ for 3 nights\" → resolve \"Madrid\" first → use id\n- \"Search hotel in London\" → resolve \"London\"\
    \ first → use id\n\nArgs:\n    destination: Numeric destination ID from resolve_destination_id (e.g.\
    \ \"141660\"),\n        or 3-letter IATA code (e.g. \"MAD\") as fallback.\n    date_from: Check-in\
    \ date (YYYY-MM-DD). Check this field MUST be today or later.\n    date_to: Check-out date (YYYY-MM-DD).\
    \ Check this field MUST be today or later.\n    adults: Number of adult travelers. If you want different\
    \ rooms, set number_adult_room1;number_adult_room2 (default: 2)\n    ch_ages: Ages of child travelers.\
    \ If you want different rooms, set number_chages_room1;number_chages_room2 (default: \"\").\n    \
    \    If there are two rooms and one is empty the result can be \";number,number\" or \"number,number;\"\
    .\n        The user MUST specify ages for each child.\n    lang: Language code (default: \"en\")\n\
    \    sort: Sort order for results. Use this when user asks for cheapest, best rated, closest to center,\
    \ etc.\n        Valid values:\n        - \"recommended\" (default): Multi-factor relevance (price,\
    \ rating, internal score)\n        - \"price\": Price ascending (cheapest first) - use when user wants\
    \ \"cheapest\" or \"lowest price\"\n        - \"stars\": Hotel star rating descending (5-star first)\
    \ - use for \"best hotels\" or \"luxury\"\n        - \"review_score\": Highest review score - use\
    \ for \"best reviewed\" or \"most popular\"\n        - \"distance\": Closest to city center first\
    \ - use for \"central\" or \"close to center\"\n    max_results: Maximum number of results to return\
    \ (default: 5, max: 20)\n    accommodation_type: Filter by accommodation type (optional).\n      \
    \  CSV of IDs 1-14: 1=Hotels, 2=Resorts, 3=Apartments, 4=Hostels, 5=Motels,\n        6=Country Houses,\
    \ 7=Guest Houses, 8=B&B, 9=Villas, 10=Boats & Cruises,\n        11=Campsites, 12=Riads, 13=Ryokans,\
    \ 14=Aparthotels.\n        Example: \"1,2\" for Hotels and Resorts\n    accommodation_facilities:\
    \ Filter by facilities/amenities (optional).\n        CSV of IDs 0-60. Examples: 0=Free Wi-Fi, 4=Pool,\
    \ 6=Spa, 7=Adults Only,\n        9=Seafront, 25=Golf, 46=Indoor Pool, 56=Bar, 58=Restaurant.\n   \
    \     Example: \"0,4,6\" for Free Wi-Fi, Pool, and Spa\n    price: Optional price filter for one-way\
    \ price per person, as string.\n        Supported formats:\n        - \"300\"      => max price 300\
    \ (in the selected currency)\n        - \"200,400\"  => price range between 200 and 400\n        Use\
    \ only digits and a comma, do NOT include currency symbols.\n        If you invert the order (\"400,200\"\
    ), the backend will normalize it to \"200,400\".\n    hotel_stars: Optional filter for hotel star\
    \ rating, as comma-separated integers.\n        Allowed values: 1,2,3,4,5. Examples:\n        - \"\
    4\"        => only 4-star hotels\n        - \"3,4\"      => 3 or 4 stars\n        - \"3,4,5\"    =>\
    \ 3, 4 or 5 stars\n\nReturns:\n    Dictionary containing search results with hotel results.\n\n═══════════════════════════════════════════════════════════════════════════\n\
    MANDATORY OUTPUT FORMAT\n═══════════════════════════════════════════════════════════════════════════\n\
    \nYou MUST present results as a Markdown table with EXACTLY these columns:\n| # | Photo | Hotel |\
