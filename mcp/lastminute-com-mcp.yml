- name: select_hotel_options
  description: "Get detailed options for a specific hotel after initial search.\n\nThis tool automatically\
    \ uses the same number of adults, children, currency,\nand business profile from the original search\
    \ to ensure consistency.\n\nArgs:\n    search_id: The search ID from the previous flight+hotel search\
    \ or only hotel search\n    hotel_internal_id: The internal hotel ID from the search results (internal_id_hotel)\n\
    \    date_from: Check-in date (YYYY-MM-DD)\n    date_to: Check-out date (YYYY-MM-DD)\n\nReturns:\n\
    \    Dictionary containing detailed hotel options, room types, and rates\n\nOUTPUT FORMAT: Use structured\
    \ sections with emoji headers (\U0001F3E8✈️\U0001F6CF️\U0001F4F8).\n1) Hotel info: name, stars, address,\
    \ check-in/out, hdp_mcp, photos (inline links)\n2) Flights: if present, show outbound/return with\
    \ carrier, times, duration\n3) Rooms table: | Room | Total Price | Cancellation | Availability |\n\
    \   - Sort by price, mark cheapest with ⭐\n   - Simplify cancellation policy\nUse the SAME LANGUAGE\
    \ as the user's request for all labels and content.\nHide internal IDs (rate_id kept for booking but\
    \ not shown in the display)."
- name: get_alternative_flights
  description: "Get alternative flight options for an existing hotel selection.\n\nInput parameters:\n\
    - pricing_id (string, REQUIRED): pricing ID returned by select_hotel_options.\n\nBehavior:\n- Can\
    \ ONLY be used AFTER select_hotel_options.\n- Returns a list of alternative flights with their details\
    \ and prices.\n- On success, alternative flight options are also stored in session\n  for later use\
    \ by change_flight.\n- Don't touch the order of the proposed flights, return them as received from\
    \ the backend."
- name: change_flight
  description: "Change the flight for an existing hotel selection.\n\nThis tool updates the flight associated\
    \ with your hotel booking after viewing alternatives.\n\n⚠️ IMPORTANT:\n    - Must be used AFTER get_alternative_flights\
    \ to see available options\n    - Requires both pricing_id and the new_transport_id from the alternatives\
    \ list\n    - This will update the total package price based on the new flight selection\n\nExample\
    \ use cases:\n- \"Change to flight option 2\"\n- \"Select the morning flight instead\"\n- \"Update\
    \ to the cheaper flight option\"\n\nArgs:\n    pricing_id: The pricing ID from select_hotel_options\
    \ response\n    new_transport_id: The transport ID of the selected alternative flight\n        (from\
    \ get_alternative_flights response)\n\nReturns:\n    Dictionary confirming the flight change with\
    \ updated package details"
- name: generate_booking_link
  description: "Generate a direct booking URL for the selected hotel room option.\n\nAfter change_flight,\
    \ rate_id values change but the internalIdRoom stays the same.\nThis tool automatically maps old rate_id\
    \ to new rate_id based on internalIdRoom only.\n\nArgs:\n    pricing_id: The pricing ID from select_hotel_options\
    \ response (NOT search_id)\n    rate_id: The rate ID of the selected room option (from select_hotel_options\
    \ response)\n\nReturns:\n    Dictionary containing the booking URL and summary details"
- name: resolve_destination_id
  description: "Resolve a city name to its internal destination ID using the lastminute.com hints API.\n\
    \nThis tool is useful when you need to map a free-text city name to a structured\ndestination identifier\
    \ before performing a hotel or package search.\n\nSupported languages: IT, EN, ES, FR, DE, PL, SE,\
    \ DK, NO, FI.\nAny unsupported language falls back to English (en-GB).\n\nArgs:\n    lang: 2-letter\
    \ language code (e.g. \"en\", \"it\", \"fr\"). Case-insensitive.\n    city_name: The city name to\
    \ resolve (e.g. \"London\", \"Roma\", \"Paris\").\n\nReturns:\n    On exact match:\n        {\n  \
    \          \"success\": true,\n            \"id\": \"<destination_id>\",\n            \"name\": \"\
    <matched city name>\",\n            \"country\": \"<country name>\",\n            \"country_code\"\
    : \"<ISO2 code>\"\n        }\n    On no exact match (returns all City-type suggestions):\n       \
    \ {\n            \"success\": false,\n            \"message\": \"No exact match found. Suggestions\
    \ returned.\",\n            \"suggestions\": [\n                {\n                    \"id\": \"\
    ...\",\n                    \"name\": \"...\",\n                    \"country\": \"...\",\n      \
    \              \"country_code\": \"...\",\n                },\n                ...\n            ]\n\
    \        }\n    On API error:\n        {\n            \"success\": false,\n            \"error\":\
    \ \"<error description>\"\n        }"
- name: search_flights
  description: "Search for flights and return available options.\n\n    Returns flights table with: airline,\
    \ route, times, duration, stops, price, booking link.\n\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \    SEARCH MODES (mutually exclusive)\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \n    1. DEFAULT MODE (no filters, no ranking):\n       Returns max_results flights sorted by PRICE\
    \ (cheapest first).\n       Use for: \"find flights\", \"cheapest flights\"\n\n    2. FILTER MODE\
    \ (any filter parameter specified):\n       Searches 100 flights, applies filters server-side, returns\
    \ max_results.\n       Filters: time ranges, price limits, airports, stops, airlines, duration.\n\
    \       Results sorted by PRICE after filtering.\n       Use for: \"morning flights\", \"under 200\
    \ EUR\", \"direct only\", \"from MXP\"\n\n    3. RANKING MODE (ranking_best=True):\n       Searches\
    \ ALL flights, applies smart ranking (price + duration + stops).\n       Returns top max_results by\
    \ overall value.\n       Use for: \"best flights\", \"recommended flights\"\n       ⚠️ MUTUALLY EXCLUSIVE\
    \ with filters\n\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \    FILTER PARAMETERS (optional, applied server-side)\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \n    Time filters (HH:MM format):\n    - departure_time_start / departure_time_end: e.g., \"06:00\"\
    \ to \"12:00\" for morning\n    - arrival_time_start / arrival_time_end: e.g., \"18:00\" to \"23:59\"\
    \ for evening arrival\n\n    Price filters (in cents):\n    - min_price_cents: minimum price (e.g.,\
    \ 5000 = 50 EUR)\n    - max_price_cents: maximum price (e.g., 20000 = 200 EUR)\n\n    Airport filters\
    \ (comma-separated IATA codes):\n    - departure_airports: \"MXP,LIN\" = only from Malpensa or Linate\n\
    \    - arrival_airports: \"LHR,LGW\" = only to Heathrow or Gatwick\n\n    Connection filters:\n  \
    \  - max_stops: 0 = direct only, 1 = max 1 stop\n\n    Airline filters (comma-separated IATA codes):\n\
    \    - airlines_include: \"FR,U2\" = only Ryanair or easyJet (whitelist)\n    - airlines_exclude:\
    \ \"FR\" = exclude Ryanair (blacklist)\n\n    Duration filter:\n    - max_duration_minutes: e.g.,\
    \ 180 = max 3 hours\n\n    Examples:\n    - Morning direct flights under 150 EUR:\n      departure_time_start=\"\
    06:00\", departure_time_end=\"12:00\", max_stops=0, max_price_cents=15000\n\n    - Flights from Malpensa\
    \ only, max 2 hours:\n      departure_airports=\"MXP\", max_duration_minutes=120\n\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \    HARD CONSTRAINTS\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \n    1. Dates:\n       - start_date MUST be today or later (YYYY-MM-DD)\n       - If roundtrip: end_date\
    \ >= start_date\n       - If user provides past date, ask for valid date BEFORE calling\n\n    2.\
    \ Price display (legal):\n       - Display 'price' text EXACTLY as returned, character-by-character\n\
    \       - Do NOT modify, reformat, or recalculate\n       - Preserve newlines (\n) if present\n\n\
    \    3. Deeplink (booking):\n       - The last column header is provided in 'table_headers' (localized:\
    \ \"Book\", \"Prenota\", \"Reservar\", etc.)\n       - Use that label as column name AND as the clickable\
    \ link text for 'deeplink' URLs\n       - Do NOT modify URL\n       - Add after table a localized\
    \ call-to-action using the same booking verb\n\n    4. Neutral tone:\n       - Present comparison\
    \ table only\n       - No rankings, opinions, or \"best/cheapest\" commentary\n\n    5. Ranking offer:\n\
    \       - After price-sorted results, always ask:\n         **\"Would you like me to re-sort by 'recommended'\
    \ (best overall value)?\"**\n       - If confirmed, call with ranking_best=True\n\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \    INPUT PARAMETERS\n    ═══════════════════════════════════════════════════════════════════════════\n\
    \n    Required:\n    - departure (str): IATA code (e.g., \"MIL\", \"MXP\")\n    - arrival (str): IATA\
    \ code (e.g., \"LON\", \"JFK\")\n    - start_date (str): YYYY-MM-DD (>= today)\n\n    Optional:\n\
    \    - end_date (str): YYYY-MM-DD for roundtrip\n    - adults (int): >= 1 (default: 1)\n    - children_ages\
    \ (str): comma-separated ages 2-11 (e.g., \"3,8\")\n    - infants_ages (str): comma-separated ages\
    \ 0-1 (e.g., \"0,1\")\n    - language (str): en/it/es/fr/de/nl/pl/se/dk/no/fi/pt/hu/cs/ro/el (auto-detected\
    \ if None)\n    - flight_class (str): ECONOMY/PREMIUM_ECONOMY/BUSINESS/FIRST_CLASS\n    - max_results\
    \ (int): 1-20, default 10\n    - ranking_best (bool): True for smart ranking (default: False)\n\n\
    \    Filters (all optional, see FILTER PARAMETERS section above):\n    - departure_time_start, departure_time_end\n\
    \    - arrival_time_start, arrival_time_end\n    - min_price_cents, max_price_cents\n    - departure_airports,\
