aid: lastminute-com
name: lastminute.com
description: 'lastminute.com N.V. (SIX Swiss Exchange: LMN) is a European travel-tech
  group and the regional leader in dynamic holiday packages, operating an online travel
  agency portfolio that includes lastminute.com, Volagratis, Rumbo, Bravofly, Weg.de,
  Jetcost and Hotelscan alongside the Forward media/advertising business. The group
  sells flights, hotels and packaged travel across a global network, and runs an engineering
  organisation that publishes an open technology blog and a Stoplight-hosted API portal
  at developers.lastminute.com. That portal is a real partner-facing API surface, but
  its projects are not anonymously readable — API reference content sits behind a workspace
  sign-in, so lastminute.com currently exposes no public OpenAPI, SDK, or self-service
  developer onboarding path.'
